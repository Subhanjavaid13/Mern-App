<!doctype html>
<html lang="en" data-theme="latte">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4ECDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B130F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Cocoa Notes — a warm, distraction-free place to capture your thoughts." />
    <title>Cocoa Notes</title>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cocoa:theme');
          if (t !== 'latte' && t !== 'espresso') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'espresso' : 'latte';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'latte');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
