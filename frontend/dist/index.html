<!doctype html>
<html lang="en" data-theme="latte">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Cocoa Notes — a simple, focused place to keep your notes." />
    <title>Cocoa Notes</title>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cocoa:theme');
          if (t !== 'latte' && t !== 'espresso') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'espresso' : 'latte';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'latte');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BZmKkeNY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-NkX4JmTD.css">
  </head>

  </body>
</html>
